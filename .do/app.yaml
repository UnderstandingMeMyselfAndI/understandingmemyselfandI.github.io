alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - disabled: true
    rule: DEPLOYMENT_LIVE
domains:
  - domain: ummi.now
    type: PRIMARY
  - domain: app.ummi.now
    type: ALIAS
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: understandingmemyselfandi-github
        preserve_path_prefix: true
      match:
        authority:
          exact: ''
        path:
          prefix: /
    - match:
        authority:
          exact: ummi.now
        path:
          prefix: /
      redirect:
        authority: app.ummi.now
        redirect_code: 302
        scheme: https
name: ummi-deploy-app
region: lon
static_sites:
  - environment_slug: html
    github:
      branch: main
      deploy_on_push: true
      repo: UnderstandingMeMyselfAndI/understandingmemyselfandI.github.io
    name: understandingmemyselfandi-github
    source_dir: docs
    catchall_document: ''
    error_document: 404.html
