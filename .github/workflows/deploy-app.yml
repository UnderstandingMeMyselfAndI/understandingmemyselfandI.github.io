name: Publish Branch To App

on:
  push:
    branches:
      - app

jobs:
  web-deploy:
    name: Deploy to App server
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get Latest Commit
        uses: actions/checkout@v4
        with:
          ref: app

      - name: 📂 Sync Files with hosting server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_KEY }}
          ARGS: '-rlgoDzvc -i -av --delete --recursive --force --compress --human-readable'
          SOURCE: 'docs/'
          REMOTE_HOST: ${{ secrets.DEPLOY_APP_SERVER }}
          REMOTE_USER: ${{ secrets.DEPLOY_APP_USER }}
          TARGET: ${{ secrets.DEPLOY_REMOTE_APP_DIR }}
          EXCLUDE: 'cms, data, playwright-report,cms,tmp, /node_modules/'
          SCRIPT_BEFORE: |
            whoami
            ls -al
          SCRIPT_AFTER: |
            whoami
            ls -al
            echo $RSYNC_STDOUT
