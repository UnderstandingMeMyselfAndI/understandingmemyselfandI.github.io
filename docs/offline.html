<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Ummi</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f0f0f0;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      p {
        max-width: 500px;
        color: #555;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="icon">🌙</div>
      <!-- or your app icon -->
      <h1>You're Offline</h1>
      <p>
        Check your connection and try again. Your changes will sync when you're
        back online.
      </p>
    </div>
  </body>
</html>
