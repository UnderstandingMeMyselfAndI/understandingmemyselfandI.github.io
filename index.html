<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Ummi - Understanding Me, Myself, and I</title>
    <meta
      name="description"
      content="Ummi is a companion app that provides quick and easy access to essential support information, helping people apply therapy tools from Cognitive Behavioural Therapy (CBT), Dialectical Behaviour Therapy (DBT), and other approaches to support their mental health, wellbeing, and addiction recovery."
    />
    <meta name="theme-color" content="#819ec9" />

    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/icons/UmmiIcon.svg"
    />
    <link rel="mask-icon" href="/icons/UmmiIcon.svg" color="#FFFFFF" />
    <link rel="apple-touch-icon" href="/icons/UmmiIcon.svg" sizes="any" />

    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="preconnect" href="https://www.ummi.now" />

    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      onload="
        this.onload = null
        this.rel = 'stylesheet'
        this.removeAttribute('as')
      "
      as="style"
    />
    <meta
      name="google-site-verification"
      content="z1GZV3sgoFTPrtQLwT4cYGE4cMFm58x1oQO_OB7w464"
    />
    <script>
      window.GA_INITIALIZED = false
    </script>
  </head>

  <body>
    <div id="root">
      <style>
        .loading-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: #000000; /* Matches your manifest theme_color */
          color: white;
          font-family: sans-serif;
        }
        .spinner {
          width: 40px;
          height: 40px;
          border: 4px solid rgba(255, 255, 255, 0.1);
          border-left-color: #ffffff;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="loading-container">
        <div class="spinner"></div>
        <p>Loading Ummi...</p>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
